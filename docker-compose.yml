services:

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: benchmark-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  seed:
    image: python:3.12-slim
    platform: linux/arm64
    container_name: benchmark-seed
    env_file:
      - .env
    volumes:
      - ./dataset:/app
    working_dir: /app
    command: bash -c "pip install psycopg2-binary faker -q --root-user-action=ignore && python seed.py"
    depends_on:
      postgres:
        condition: service_healthy

  # ── PHP: raw_sql + eloquent + doctrine ───────────────────
  php:
    build:
      context: ./benchmarks/php
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-php
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
 
  # ── TypeScript: raw_sql + prisma + drizzle ───────────────
  typescript:
    build:
      context: ./benchmarks/typescript
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-typescript
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
 
  # ── Python: raw_sql + sqlalchemy ─────────────────────────
  python:
    build:
      context: ./benchmarks/python
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-python
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
 
  # ── Java: raw_sql + hibernate ────────────────────────────
  java:
    build:
      context: ./benchmarks/java
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-java
    env_file:
      - .env
    environment:
      JAVA_OPTS: "-XX:ActiveProcessorCount=1 -XX:ConcGCThreads=1 -XX:ParallelGCThreads=1"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  pgdata:
