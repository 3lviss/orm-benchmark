services:

  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: benchmark-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  seed:
    image: python:3.12-slim
    platform: linux/arm64
    container_name: benchmark-seed
    env_file:
      - .env
    volumes:
      - ./dataset:/app
    working_dir: /app
    command: bash -c "pip install psycopg2-binary faker -q --root-user-action=ignore && python seed.py"
    depends_on:
      postgres:
        condition: service_healthy

  raw_sql:
    build:
      context: ./benchmarks/raw_sql
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-raw-sql
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  eloquent:
    build:
      context: ./benchmarks/eloquent
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-eloquent
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  doctrine:
    build:
      context: ./benchmarks/doctrine
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-doctrine
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  prisma:
    build:
      context: ./benchmarks/prisma
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-prisma
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  drizzle:
    build:
      context: ./benchmarks/drizzle
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-drizzle
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASS}@postgres:5432/${DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  sqlalchemy:
    build:
      context: ./benchmarks/sqlalchemy
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-sqlalchemy
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

  hibernate:
    build:
      context: ./benchmarks/hibernate
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: benchmark-hibernate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G

volumes:
  pgdata:
