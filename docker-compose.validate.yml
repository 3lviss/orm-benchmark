# Enables pg_stat_statements so query counts can be read on the database side.
# Benchmark runs (runner/run_all.sh) use docker-compose.yml alone, without this override.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=on
      - -c
      - pg_stat_statements.max=10000
