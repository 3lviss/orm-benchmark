# Override used only by scripts/validate.sh (docs/PLAN_REPO.md 2.5).
# Enables pg_stat_statements so query counts can be read on the database side.
# Benchmark runs (phase 4) use docker-compose.yml alone, without this override.
services:
  postgres:
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=on
      - -c
      - pg_stat_statements.max=10000
